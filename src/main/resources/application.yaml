spring:
  application:
    name: accounting-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounting}
    username: ${DB_USERNAME:accounting}
    password: ${DB_PASSWORD:accounting}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: accounting
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
